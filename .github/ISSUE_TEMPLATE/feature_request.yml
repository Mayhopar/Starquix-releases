name: Idea or feature request
description: Something Starquix should do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, and how you get around it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
